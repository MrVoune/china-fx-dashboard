name: Refresh data

on:
  schedule:
    - cron: "30 2 * * *"   # daily, 02:30 UTC (after Fed H.10 / Treasury / ChinaBond daily updates)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch data
        id: fetch
        continue-on-error: true
        run: python scripts/fetch_data.py
      - name: Verify against original sources
        id: verify
        continue-on-error: true
        run: python scripts/verify.py
      - name: Commit refreshed data and log
        run: |
          git config user.name "refresh-bot"
          git config user.email "refresh-bot@users.noreply.github.com"
          git add data logs docs/verification_output.txt
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Refresh data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
      - name: Fail the job if any source failed
        if: steps.fetch.outcome == 'failure' || steps.verify.outcome == 'failure'
        run: |
          echo "A source failed or a verification check failed; see logs/refresh_log.txt and docs/verification_output.txt"
          exit 1
